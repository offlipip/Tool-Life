name: Gerar APK Android (Toolpy)

# Builda o app Android de dentro do repositório (este ambiente de build
# tem o SDK do Android completo, diferente do computador usado pra
# preparar os arquivos). O app nativo só carrega o site publicado no
# GitHub Pages (ver capacitor.config.json) — então, no dia a dia, só
# precisa gerar um APK novo quando alguma coisa dentro da pasta
# android/ mudar (como o leitor de foto nativo), não a cada ajuste de
# tela comum.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Aceitar licenças e garantir o SDK necessário
        run: |
          SDK_ROOT=""
          for root in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" "/usr/local/lib/android/sdk"; do
            if [ -n "$root" ] && [ -d "$root/cmdline-tools" ]; then
              SDK_ROOT="$root"
              break
            fi
          done
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Não achei uma pasta cmdline-tools em ANDROID_SDK_ROOT ($ANDROID_SDK_ROOT), ANDROID_HOME ($ANDROID_HOME) nem em /usr/local/lib/android/sdk"
            exit 1
          fi
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | sort -r | head -n1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Achei $SDK_ROOT/cmdline-tools mas nenhum binário sdkmanager dentro"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3
            exit 1
          fi
          echo "Usando: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - run: npm install
      - run: npm run build
      - run: npx cap sync android

      - name: Compilar APK de depuração
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: toolpy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
