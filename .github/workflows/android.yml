name: Gerar APK Android (Toolpy)

# Builda o app Android de dentro do repositório (este ambiente de build
# tem o SDK do Android completo, diferente do computador usado pra
# preparar os arquivos). O app nativo só carrega o site publicado no
# GitHub Pages (ver capacitor.config.json) — então, no dia a dia, só
# precisa gerar um APK novo quando alguma coisa dentro da pasta
# android/ mudar (como o leitor de foto nativo), não a cada ajuste de
# tela comum.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pra publicar o APK numa Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Aceitar licenças e garantir o SDK necessário
        run: |
          SDK_ROOT=""
          for root in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" "/usr/local/lib/android/sdk"; do
            if [ -n "$root" ] && [ -d "$root/cmdline-tools" ]; then
              SDK_ROOT="$root"
              break
            fi
          done
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Não achei uma pasta cmdline-tools em ANDROID_SDK_ROOT ($ANDROID_SDK_ROOT), ANDROID_HOME ($ANDROID_HOME) nem em /usr/local/lib/android/sdk"
            exit 1
          fi
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -name sdkmanager -type f | sort -r | head -n1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Achei $SDK_ROOT/cmdline-tools mas nenhum binário sdkmanager dentro"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3
            exit 1
          fi
          echo "Usando: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - run: npm install
      - run: npm run build

      - name: Sincronizar Capacitor (Android)
        id: capsync
        continue-on-error: true
        run: npx cap sync android > cap-sync.log 2>&1

      - name: Mostrar erro do cap sync, se tiver
        if: steps.capsync.outcome == 'failure'
        run: |
          cat cap-sync.log
          tail -n 25 cap-sync.log | while IFS= read -r line; do echo "::error::$line"; done
          exit 1

      - name: Preparar assinatura fixa
        env:
          KS_B64: ${{ secrets.TOOLPY_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::Segredo TOOLPY_KEYSTORE_B64 não configurado — o APK sai com assinatura aleatória e não instala por cima do anterior."
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/toolpy.jks"
            echo "TOOLPY_KEYSTORE_FILE=$RUNNER_TEMP/toolpy.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK de depuração
        working-directory: android
        env:
          TOOLPY_KEYSTORE_PASSWORD: ${{ secrets.TOOLPY_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: toolpy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Link direto, sem login e sem .zip — dá pra baixar pelo navegador do
      # celular: https://github.com/offlipip/Tool-Life/releases/download/apk-latest/toolpy.apk
      - name: Publicar APK numa Release (link direto pro celular)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk toolpy.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest toolpy.apk \
            --prerelease \
            --title "Toolpy APK (mais recente)" \
            --notes "APK de depuração gerado automaticamente do commit ${GITHUB_SHA::7}."
